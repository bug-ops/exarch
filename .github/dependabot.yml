version: 2
updates:
  # Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    # #627: half is held at 2.4.1 (2.5+ pulls zerocopy-derive on syn 2, a duplicate syn).
    # Unpin once zerocopy-derive ships a stable release on syn 3 or half drops zerocopy.
    ignore:
      - dependency-name: "half"
        versions: [">=2.5"]
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group minor and patch updates
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # fuzz/ has its own Cargo.lock (excluded from the root workspace) and no
  # automated update path without this: fuzz-build is mandatory in
  # ci-success, so a libfuzzer-sys/cc nightly break would otherwise red
  # every PR in the repo with nothing to fix it.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
