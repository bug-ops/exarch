version: 2
updates:
  # Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    ignore:
      # #854: a lone direct bump leaves two windows-sys versions and fails
      # cargo-deny `multiple-versions`; move it together with the transitive users.
      - dependency-name: "windows-sys"
        versions: [">=0.62"]
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group minor and patch updates; the wildcard also moves lzma-rust2 and
    # sevenz-rust2 together, avoiding the duplicate graph of #830.
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # fuzz/ has its own Cargo.lock (excluded from the root workspace) and no
  # automated update path without this: fuzz-build is mandatory in
  # ci-success, so a libfuzzer-sys/cc nightly break would otherwise red
  # every PR in the repo with nothing to fix it.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"

  # Python tooling pinned in uv.lock (maturin wheel builder, dev tools, CI
  # pip-audit); the release and CI workflows install from this lock with
  # --require-hashes.
  - package-ecosystem: "uv"
    directory: "/crates/exarch-python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"

  # Node.js dev/build tooling pinned in pnpm-lock.yaml (@napi-rs/cli, biome,
  # typescript); CI installs with --frozen-lockfile and runs pnpm audit.
  - package-ecosystem: "npm"
    directory: "/crates/exarch-node"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "node"
    commit-message:
      prefix: "chore"
