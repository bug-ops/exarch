name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly dependency security check
    - cron: '0 0 * * 0'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"
  RUSTUP_MAX_RETRIES: 10

# Default to minimal permissions (security best practice)
permissions:
  contents: read

# Cancel previous runs on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which files changed to optimize job execution
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      ci: ${{ steps.filter.outputs.ci }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'deny.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
            python:
              - 'crates/exarch-python/**'
              - 'crates/exarch-core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            node:
              - 'crates/exarch-node/**'
              - 'crates/exarch-core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            ci:
              - '.github/workflows/**'
              - '.github/labeler.yml'
            docs:
              - '**/*.md'
              - '**/README.md'

  # Quick checks first - fail fast
  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Check formatting (fuzz crate)
        run: cargo +nightly fmt --manifest-path fuzz/Cargo.toml -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "clippy"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "doc"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --no-deps --all-features --workspace 2>&1 | tee /tmp/cargo-doc.log
          # cargo emits target output-path collisions as a warning, not a rustdoc lint, so
          # RUSTDOCFLAGS="-D warnings" above cannot catch it (see #429) — assert it separately.
          if grep -q "output filename collision" /tmp/cargo-doc.log; then
            echo "::error::cargo doc reported an output filename collision (see #429)"
            exit 1
          fi

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          log-level: warn
          command: check
          arguments: --all-features

      # fuzz/ is outside the root workspace, so the check above cannot see its
      # dep tree (libfuzzer-sys, arbitrary, cc). Advisories only -- NCSA stays
      # off deny.toml's allow-list for anything shipped. Scheduled-only:
      # .github/dependabot.yml only covers directory "/", so fuzz/Cargo.lock
      # has no automated update path and this step must not red every PR.
      - name: Run cargo-deny (fuzz crate advisories)
        if: github.event_name == 'schedule'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          log-level: warn
          manifest-path: fuzz/Cargo.toml
          command: check
          command-arguments: advisories

  # Scheduled fuzzing. Narrow but real: 5 targets x 300s weekly on a corpus
  # that persists via actions/cache, layered on top of the existing
  # regression-test harness -- not a replacement for it. Deliberately not in
  # ci-success: non-blocking by design, only fuzz-build above gates PRs.
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: github.event_name == 'schedule'
    env:
      RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        target: [safe_path, tar, zip, sevenz, extract_archive]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "fuzz-${{ matrix.target }}"
          workspaces: "fuzz"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: cargo-fuzz

      # actions/cache has post-if: "success()", so a plain cache@v4 step would
      # discard the corpus on exactly the run where libFuzzer finds a crash
      # (nonzero exit). Restore/save split with `if: always()` on save fixes
      # that; same key + restore-keys keeps the rolling window.
      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Seed corpus
        run: ./fuzz/seed-corpus.sh

      - name: Fuzz ${{ matrix.target }}
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} \
            -- -max_total_time=300 -timeout=25 -rss_limit_mb=2048 \
            -print_final_stats=1

      - name: Save fuzz corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

  # Cross-platform tests with matrix
  test:
    name: Test (${{ matrix.os }})
    needs: [changes, format]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: |
      needs.changes.outputs.rust == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "test-${{ matrix.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install nextest
        uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: nextest

      - name: Build all targets
        run: cargo build --workspace --all-targets --all-features --exclude exarch-python --exclude exarch-node

      - name: Run tests
        run: cargo nextest run --workspace --all-features --no-fail-fast --exclude exarch-python --exclude exarch-node

      - name: Run doctests
        run: cargo test --doc --workspace --all-features --exclude exarch-python --exclude exarch-node

  # Release-profile tests for exarch-core: exercises cfg(not(debug_assertions))
  # tests (e.g. release-only redaction/security assertions) that the debug-mode
  # `test` job above never runs (see #476).
  test-release:
    name: Test (release profile)
    needs: [changes, format]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      needs.changes.outputs.rust == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "test-release"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install nextest
        uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: nextest

      - name: Run release-profile tests (exarch-core)
        run: cargo nextest run -p exarch-core --release --all-features --no-fail-fast

  # Test Python bindings with coverage
  test-python:
    name: Test Python ${{ matrix.python-version }}
    needs: [changes, format]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # always() + explicit needs.format.result check is required here: a job
    # with `needs: [format]` is skipped by GitHub Actions whenever `format`
    # itself is skipped (e.g. on a Python-only PR, where rust == 'false'),
    # regardless of what this job's own `if` says, unless always() overrides
    # that default gating.
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.changes.outputs.python == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop')
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "python"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: |
          cd crates/exarch-python
          uv pip install --system maturin "ruff==0.16.0" mypy pytest pytest-cov

      - name: Run Rust unit tests (exarch-python)
        run: cargo test -p exarch-python --lib --no-default-features

      - name: Format check with ruff
        run: |
          cd crates/exarch-python
          ruff format --check .

      - name: Lint with ruff
        run: |
          cd crates/exarch-python
          ruff check .

      - name: Type check with mypy
        run: |
          cd crates/exarch-python
          mypy . --ignore-missing-imports || true

      - name: Build Python bindings
        run: |
          cd crates/exarch-python
          # panic-injection exposes a deliberate-panic test hook used by the
          # #395 regression test (test_panic_safety.py); never enabled for
          # published wheels (see release.yml).
          maturin build --release --features panic-injection,abi3

      - name: Install Python bindings
        run: uv pip install --system target/wheels/*.whl

      - name: Test Python bindings
        if: matrix.python-version != '3.12'
        run: |
          cd crates/exarch-python
          pytest tests/ -v

      # Coverage is only measured once (Python version doesn't change which
      # lines of the Rust-backed bindings get exercised), so only one matrix
      # leg uploads to Codecov — uploading all 5 would just duplicate the
      # same flag's data and race codecov.yml's after_n_builds threshold.
      - name: Test Python bindings with coverage
        if: matrix.python-version == '3.12'
        run: |
          cd crates/exarch-python
          pytest tests/ -v --cov --cov-report=xml:coverage.xml

      - name: Upload Python coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: crates/exarch-python/coverage.xml
          flags: exarch-python
          fail_ci_if_error: false

  # Test Node.js bindings with coverage
  test-node:
    name: Test Node.js Bindings
    needs: [changes, format]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.changes.outputs.node == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "node"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd crates/exarch-node
          npm install

      - name: Run Rust unit tests (exarch-node)
        run: cargo test -p exarch-node --lib

      - name: Format check with Biome
        run: |
          cd crates/exarch-node
          npm run format:check

      - name: Lint with Biome
        run: |
          cd crates/exarch-node
          npm run lint

      - name: Build Node.js bindings
        run: |
          cd crates/exarch-node
          npm run build

      - name: Test Node.js bindings
        run: |
          cd crates/exarch-node
          npm test

  # Smoke-test the napi addon under Bun and Deno (issue #567). Not part of
  # the full Node.js test matrix -- Node.js remains the only fully supported
  # runtime. Non-blocking failures are limited to the progress-callback
  # sub-test inside the script itself; everything else here is a hard failure.
  test-node-runtimes:
    name: Test Node.js Bindings (Bun/Deno smoke test)
    needs: [changes, format]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.changes.outputs.node == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "node"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd crates/exarch-node
          npm install

      - name: Build Node.js bindings
        run: |
          cd crates/exarch-node
          npm run build

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Smoke test under Bun
        run: bun run crates/exarch-node/scripts/smoke-test.mjs

      - name: Smoke test under Deno
        run: deno run --allow-read --allow-write --allow-env --allow-ffi crates/exarch-node/scripts/smoke-test.mjs

  # Quick compile-only check for criterion benchmarks (does not run them)
  bench-build:
    name: Bench Build Check
    needs: [changes, format]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      needs.changes.outputs.rust == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "bench-build"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build benchmarks (compile only, does not run them)
        run: cargo build --workspace --benches --all-features --exclude exarch-python --exclude exarch-node

  # Mandatory per-PR compile gate for fuzz/. Without this a core API change
  # could break every fuzz target for up to a week before the scheduled `fuzz`
  # job below (which nobody watches) surfaces it.
  fuzz-build:
    name: Fuzz Build Check
    needs: [changes, format]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      needs.changes.outputs.rust == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "fuzz-build"
          workspaces: "fuzz"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Syntax-check seed-corpus.sh
        run: bash -n fuzz/seed-corpus.sh

      - name: Check fuzz targets compile
        env:
          RUSTFLAGS: ""
        run: cargo +nightly check --manifest-path fuzz/Cargo.toml --all-targets

  # MSRV check (exarch-core only)
  msrv:
    name: MSRV Check (exarch-core)
    needs: [changes, format]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      needs.changes.outputs.rust == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "msrv"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check MSRV for exarch-core
        run: cargo check -p exarch-core --all-features

  # Code coverage (Linux only) - codecov auto-distributes by paths
  coverage:
    name: Code Coverage
    needs: [changes, format]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    if: |
      needs.changes.outputs.rust == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "coverage"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: cargo-llvm-cov

      - name: Install nextest
        uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: nextest

      - name: Generate coverage report
        run: |
          cargo llvm-cov --all-features --workspace \
            --exclude exarch-python --exclude exarch-node \
            --lcov --output-path lcov.info nextest

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: exarch-core, exarch-cli
          fail_ci_if_error: false
          verbose: true

  # All checks passed
  ci-success:
    name: CI Success
    needs: [format, clippy, documentation, security, test, test-release, test-python, test-node, test-node-runtimes, msrv, bench-build, fuzz-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          # Required jobs that must pass
          REQUIRED_JOBS=(
            "${{ needs.format.result }}"
            "${{ needs.clippy.result }}"
            "${{ needs.documentation.result }}"
            "${{ needs.security.result }}"
            "${{ needs.test.result }}"
            "${{ needs.test-release.result }}"
            "${{ needs.test-python.result }}"
            "${{ needs.test-node.result }}"
            "${{ needs.test-node-runtimes.result }}"
            "${{ needs.msrv.result }}"
            "${{ needs.bench-build.result }}"
            "${{ needs.fuzz-build.result }}"
          )

          for result in "${REQUIRED_JOBS[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Required job failed or was cancelled: $result"
              exit 1
            fi
          done

          echo "All required jobs passed successfully!"
