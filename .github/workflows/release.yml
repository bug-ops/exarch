name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Validate tag and extract version
  validate:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Verify version matches Cargo.toml
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          CARGO_VERSION=$(grep -m 1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Cargo.toml version ($CARGO_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "Version validation successful: $TAG_VERSION"

  # Build and publish Rust crates to crates.io using Trusted Publishing (OIDC)
  # Setup: https://crates.io/docs/trusted-publishing
  publish-crates:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "release"

      - name: Verify packages can be built
        run: |
          cargo build -p exarch-core --release --all-features
          cargo build -p exarch-cli --release --all-features

      - name: Run tests
        run: |
          cargo test -p exarch-core --all-features
          cargo test -p exarch-cli --all-features

      - name: Authenticate with crates.io (Trusted Publishing)
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish crates to crates.io
        uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b # v2
        with:
          registry-token: ${{ steps.crates-io-auth.outputs.token }}
          ignore-unpublished-changes: true
          publish-delay: 10000

  # Build Python wheels for multiple platforms
  build-python-wheels:
    name: Build Python Wheels (${{ matrix.platform.name }})
    needs: validate
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux x86_64
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # Linux aarch64
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu

          # Linux x86_64 (musl)
          - name: linux-musl-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl-image: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl@sha256:3f1010eb48311dfde5d51f011163451940af34bd317355c4a8652ce6b4b61051

          # Linux aarch64 (musl)
          - name: linux-musl-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            musl-image: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl@sha256:02e790506c5f15a533bc05b3af8719b16a8a2314480f6f0fdc0166432035d9b4

          # macOS x86_64
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin

          # macOS aarch64 (Apple Silicon)
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin

          # Windows x86_64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7

      - name: Install maturin
        shell: bash
        working-directory: crates/exarch-python
        run: |
          uv export --locked --no-emit-project --only-group release -o "$RUNNER_TEMP/python-release-requirements.txt"
          uv pip install --system --require-hashes --no-build -r "$RUNNER_TEMP/python-release-requirements.txt"

      - name: Setup cross-compilation (Linux aarch64)
        if: matrix.platform.name == 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "python-${{ matrix.platform.name }}"

      # The image digest is the multi-arch index digest of the tag, resolved with
      # `docker buildx imagetools inspect`. Dependabot does not update it; bump by hand.
      - name: Build wheels (musl)
        if: matrix.platform.musl-image
        shell: bash
        working-directory: crates/exarch-python
        env:
          IMAGE: ${{ matrix.platform.musl-image }}
          TARGET: ${{ matrix.platform.target }}
        run: |
          MATURIN_BIN="$(readlink -f "$(command -v maturin)")"
          file "$MATURIN_BIN" | grep -q 'statically linked'
          MUSL_REQUIREMENTS="$RUNNER_TEMP/python-release-musl-requirements.txt"
          uv export --locked --no-emit-project --only-group release-musl -o "$MUSL_REQUIREMENTS"
          docker run --rm \
            -e TARGET -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -e WORKSPACE="$GITHUB_WORKSPACE" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$MATURIN_BIN:/usr/local/bin/maturin:ro" \
            -v "$MUSL_REQUIREMENTS:/tmp/release-musl-requirements.txt:ro" \
            -w "$GITHUB_WORKSPACE/crates/exarch-python" \
            "$IMAGE" bash -euo pipefail -c '
              fix_owner() {
                chown -R "$HOST_UID:$HOST_GID" "$WORKSPACE/target" "$WORKSPACE/crates/exarch-python/wheels" \
                  || echo "warning: chown of build outputs failed" >&2
              }
              trap fix_owner EXIT
              rm -rf "$RUSTUP_HOME/toolchains"
              rustup toolchain install 1.99.1 --profile minimal
              rustup override set 1.99.1
              rustup target add "$TARGET"
              python3 -m pip install --user --require-hashes --only-binary :all: -r /tmp/release-musl-requirements.txt
              export PATH="$PATH:$HOME/.local/bin"
              maturin build --release --strip --out wheels -i python3.11 --target "$TARGET" --compatibility musllinux_1_2
            '

      - name: Build wheels
        if: ${{ !matrix.platform.musl-image }}
        working-directory: crates/exarch-python
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: maturin build --release --target "$TARGET" --strip --out wheels -i python3.11

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-${{ matrix.platform.name }}
          path: crates/exarch-python/wheels/*.whl
          retention-days: 7

  # Build exarch-cli binaries for multiple platforms
  build-cli-binaries:
    name: Build CLI Binary (${{ matrix.platform.name }})
    needs: validate
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux x86_64
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

          # Linux aarch64
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz

          # macOS x86_64
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz

          # macOS aarch64 (Apple Silicon)
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

          # Windows x86_64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}

      - name: Setup cross-compilation (Linux aarch64)
        if: matrix.platform.name == 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "cli-${{ matrix.platform.name }}"

      - name: Build exarch-cli
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: cargo build -p exarch-cli --release --target "$TARGET"

      - name: Package archive (Unix)
        if: matrix.platform.archive == 'tar.gz'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.platform.target }}
        run: |
          NAME="exarch-${VERSION}-${TARGET}"
          STAGE="$(mktemp -d)/${NAME}"
          mkdir -p "$STAGE"
          cp "target/${TARGET}/release/exarch" "$STAGE/"
          cp LICENSE-MIT LICENSE-APACHE README.md "$STAGE/"
          tar -C "$(dirname "$STAGE")" -czf "${NAME}.tar.gz" "${NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          fi

      - name: Package archive (Windows)
        if: matrix.platform.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.platform.target }}
        run: |
          $Name = "exarch-$Env:VERSION-$Env:TARGET"
          $Stage = Join-Path $Env:RUNNER_TEMP $Name
          New-Item -ItemType Directory -Path $Stage | Out-Null
          Copy-Item "target/$Env:TARGET/release/exarch.exe" -Destination $Stage
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md -Destination $Stage
          Compress-Archive -Path $Stage -DestinationPath "$Name.zip"
          (Get-FileHash "$Name.zip" -Algorithm SHA256).Hash.ToLower() + "  $Name.zip" | Out-File -Encoding ascii "$Name.zip.sha256"

      - name: Upload CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-${{ matrix.platform.name }}
          path: |
            exarch-*.tar.gz
            exarch-*.tar.gz.sha256
            exarch-*.zip
            exarch-*.zip.sha256
          retention-days: 7

  # Publish Python wheels to PyPI using Trusted Publishing (OIDC)
  # Setup: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
  publish-python:
    name: Publish to PyPI
    needs: [validate, build-python-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/exarch/
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true

  # Build Node.js native addons for multiple platforms
  build-node-bindings:
    name: Build Node.js Bindings (${{ matrix.platform.name }})
    needs: validate
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux x86_64
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # Linux aarch64
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu

          # macOS x86_64
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin

          # macOS aarch64 (Apple Silicon)
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin

          # Windows x86_64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Setup cross-compilation (Linux aarch64)
        if: matrix.platform.name == 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "node-${{ matrix.platform.name }}"

      - name: Install dependencies
        working-directory: crates/exarch-node
        run: pnpm install --no-frozen-lockfile

      - name: Build native addon
        working-directory: crates/exarch-node
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: pnpm run build --target "$TARGET"

      - name: Upload bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bindings-${{ matrix.platform.name }}
          path: |
            crates/exarch-node/*.node
            crates/exarch-node/index.js
            crates/exarch-node/index.d.ts
          retention-days: 7

  # Publish Node.js package to npm using Trusted Publishing (OIDC)
  # Setup: https://docs.npmjs.com/trusted-publishers/
  # No NPM_TOKEN needed - uses OIDC authentication
  publish-node:
    name: Publish to npm
    needs: [validate, build-node-bindings]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/exarch-rs
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Download all bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: bindings
          pattern: bindings-*

      - name: Prepare npm package
        working-directory: crates/exarch-node
        run: |
          mkdir -p native

          for platform_dir in ../../bindings/bindings-*; do
            if [ -d "$platform_dir" ]; then
              cp -v "$platform_dir"/*.node native/ || true
            fi
          done

          ls -lh native/

      - name: Install dependencies
        working-directory: crates/exarch-node
        run: pnpm install --no-frozen-lockfile

      - name: Publish to npm (Trusted Publishing)
        working-directory: crates/exarch-node
        run: pnpm publish --access public --no-git-checks --provenance --ignore-scripts

  # Create GitHub Release with artifacts
  github-release:
    name: Create GitHub Release
    needs: [validate, publish-crates, publish-python, publish-node, build-cli-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # softprops/action-gh-release creates the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Python wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-artifacts/python
          pattern: wheels-*
          merge-multiple: true

      - name: Download Node.js bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-artifacts/node
          pattern: bindings-*

      - name: Download CLI binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-artifacts/cli
          pattern: cli-*
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "First release - no previous tag found"
            CHANGELOG="Initial release v$VERSION"
          else
            echo "Generating changelog from $PREV_TAG to v$VERSION"
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Save to file for multiline handling
          echo "$CHANGELOG" > changelog.txt

          cat >> changelog.txt << EOF

          ## Installation

          ### Rust
          \`\`\`toml
          [dependencies]
          exarch-core = "$VERSION"
          \`\`\`

          ### Python
          \`\`\`bash
          pip install exarch==$VERSION
          \`\`\`

          ### Node.js
          \`\`\`bash
          npm install exarch-rs@$VERSION
          \`\`\`

          ### Rust CLI
          \`\`\`bash
          cargo install exarch-cli
          \`\`\`
          Or download a prebuilt \`exarch-$VERSION-<target>\` archive from this release's assets
          (or run \`curl -fsSL https://raw.githubusercontent.com/bug-ops/exarch/main/scripts/install.sh | sh\`),
          both of which skip the Rust toolchain requirement.

          ## Artifacts

          - Python wheels for Linux (x86_64, aarch64), Linux musl (x86_64, aarch64), macOS (x86_64, aarch64), Windows (x86_64)
          - Node.js native addons for Linux (x86_64, aarch64), macOS (x86_64, aarch64), Windows (x86_64)
          - CLI binaries for Linux (x86_64, aarch64), macOS (x86_64, aarch64), Windows (x86_64) as
            \`exarch-$VERSION-<target>.tar.gz\` / \`.zip\` with \`.sha256\` checksums, plus \`install.sh\`
          - Published to [crates.io](https://crates.io/crates/exarch-core), [PyPI](https://pypi.org/project/exarch), and [npm](https://www.npmjs.com/package/exarch-rs)
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: Release v${{ needs.validate.outputs.version }}
          body_path: changelog.txt
          draft: false
          prerelease: false
          files: |
            release-artifacts/python/*.whl
            release-artifacts/node/**/*.node
            release-artifacts/cli/*.tar.gz
            release-artifacts/cli/*.tar.gz.sha256
            release-artifacts/cli/*.zip
            release-artifacts/cli/*.zip.sha256
            scripts/install.sh
          token: ${{ secrets.GITHUB_TOKEN }}

  # Final success check
  release-success:
    name: Release Success
    needs: [publish-crates, publish-python, publish-node, github-release]
    runs-on: ubuntu-latest
    if: always()
    permissions: {}
    steps:
      - name: Check all release jobs
        env:
          PUBLISH_CRATES_RESULT: ${{ needs.publish-crates.result }}
          PUBLISH_PYTHON_RESULT: ${{ needs.publish-python.result }}
          PUBLISH_NODE_RESULT: ${{ needs.publish-node.result }}
          GITHUB_RELEASE_RESULT: ${{ needs.github-release.result }}
        run: |
          REQUIRED_JOBS=(
            "$PUBLISH_CRATES_RESULT"
            "$PUBLISH_PYTHON_RESULT"
            "$PUBLISH_NODE_RESULT"
            "$GITHUB_RELEASE_RESULT"
          )

          for result in "${REQUIRED_JOBS[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "Release job failed: $result"
              exit 1
            fi
          done

          echo "All release jobs completed successfully!"
