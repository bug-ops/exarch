name: ZIP Drift

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-zip:
    name: exarch-core against the latest zip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: zip-drift
          save-if: false

      - name: Install nextest
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: nextest

      - name: Install JDK for ZIP producer tests
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Update zip to the newest 9.x release, beyond the pinned requirement
        env:
          # Override .cargo/config.toml's [registry] global-min-publish-age cooldown:
          # this workflow intentionally resolves freshly published zip releases.
          CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE: allow
        run: |
          sed -i 's/^zip = { version = "~9\.[0-9]*"/zip = { version = "9"/' Cargo.toml
          grep -q '^zip = { version = "9"' Cargo.toml
          cargo update -p zip
          cargo tree -p exarch-core --depth 1 --edges normal | grep -E 'zip v'

      - name: Run exarch-core tests
        run: cargo nextest run -p exarch-core --all-features
