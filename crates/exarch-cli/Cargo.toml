[package]
name = "exarch-cli"
description = "Command-line utility for secure archive extraction and creation"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "exarch"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "cargo", "wrap_help", "color"] }
clap_complete.workspace = true
console.workspace = true
exarch-core = { workspace = true, features = ["encryption"] }
indicatif = { workspace = true, features = ["improved_unicode"] }
rpassword.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
signal-hook.workspace = true

[target.'cfg(windows)'.dependencies]
ctrlc.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
exarch-testkit.workspace = true
flate2.workspace = true
predicates.workspace = true
sevenz-rust2.workspace = true
tar.workspace = true
zip.workspace = true

[features]
# Test-only seams (stalled read, sandbox probe) compiled into debug builds only;
# never enabled for a shipped binary.
test-hooks = []

[lints]
workspace = true
