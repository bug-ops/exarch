[package]
name = "exarch-core"
description = "Memory-safe archive extraction library with security validation"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bzip2.workspace = true
flate2.workspace = true
globset.workspace = true
liblzma.workspace = true
lzma-rust2.workspace = true
sevenz-rust2.workspace = true
smallvec.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
typed-path.workspace = true
unicode-normalization.workspace = true
walkdir.workspace = true
zip = { workspace = true, features = ["deflate", "deflate64", "bzip2", "zstd", "time"] }
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[target.'cfg(any(unix, target_os = "wasi"))'.dependencies]
rustix = { workspace = true, features = ["fs", "alloc"] }

[dev-dependencies]
criterion.workspace = true
exarch-testkit.workspace = true
dhat.workspace = true
proptest.workspace = true
trybuild.workspace = true

[features]
# Exposes security primitives as `pub` for external benchmarks and integration
# tests that cannot access pub(crate) items. Not intended for production use.
testing = []

[lints]
workspace = true

[[test]]
name = "property_tests"
required-features = ["testing"]

[[bench]]
name = "creation"
harness = false

[[bench]]
name = "extraction"
harness = false

[[bench]]
name = "validation"
harness = false
required-features = ["testing"]

[[bench]]
name = "progress"
harness = false

[[bench]]
name = "symlink_resolution"
harness = false
