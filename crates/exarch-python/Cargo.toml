[package]
name = "exarch-python"
description = "Python bindings for exarch-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
# Deliberately not "exarch": that collides with exarch-cli's `[[bin]]` name at the
# `cargo doc` output-path level (#429). The Python-facing module name stays "exarch"
# via `[tool.maturin] module-name` in pyproject.toml, decoupled from this Cargo name.
name = "exarch_pylib"
crate-type = ["cdylib", "rlib"]

[dependencies]
exarch-core.workspace = true
pyo3.workspace = true

[features]
# Enabled by default so plain `cargo build`/`maturin develop` behave as
# before. Disable it (`--no-default-features`) to run `cargo test --lib`:
# extension-module tells pyo3 to expect the host process (the Python
# interpreter) to provide libpython symbols at dlopen time, which a
# standalone test binary cannot satisfy — see PyO3's user guide section on
# testing extension modules.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
abi3 = ["pyo3/abi3-py39"]
# Exposes `_trigger_panic_for_testing()`, a deliberate-panic hook used by the
# #395 regression test to verify the catch_unwind -> PyRuntimeError
# conversion end-to-end through the real Python API. Never enabled for
# published wheels (see release.yml); only CI's test-python job builds with
# it (see ci.yml).
panic-injection = []

[lints]
workspace = true
