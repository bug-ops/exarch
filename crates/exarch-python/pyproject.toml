[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "exarch"
version = "0.10.0"
description = "Memory-safe archive extraction library with built-in security validation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
keywords = ["archive", "extraction", "security", "tar", "zip", "gzip", "path-traversal", "zip-bomb"]
authors = [
    { name = "Exarch Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: System :: Archiving",
    "Topic :: System :: Archiving :: Compression",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/bug-ops/exarch"
Repository = "https://github.com/bug-ops/exarch"
Documentation = "https://github.com/bug-ops/exarch#readme"
Issues = "https://github.com/bug-ops/exarch/issues"

[dependency-groups]
# Wheel build tool: uv.lock is the source for the release workflow and CI.
# `[build-system].requires` above must carry the same exact version; the
# `check-maturin-pin` CI step fails when they drift.
release = ["maturin==1.16.0"]
# Bundled into musllinux wheels inside the build container only (release.yml).
release-musl = ["patchelf==0.19.1.0"]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0",
    "Pygments>=2.20.0",
    "mypy>=2.0",
    "ruff==0.17.4",
    { include-group = "release" },
]

[tool.maturin]
# Pins the Python-facing module name independently of Cargo's `[lib] name`
# (which is "exarch_pylib", see crates/exarch-python/Cargo.toml, #429). This
# drives PyInit_* symbol resolution, the wheel's module directory name, and
# `exarch.pyi` stub discovery — must match `#[pymodule] fn exarch(...)`.
module-name = "exarch"
features = ["pyo3/extension-module", "abi3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
