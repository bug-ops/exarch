# cargo-deny configuration

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",  # zstd/zstd-safe/zstd-sys switched from MIT starting at zstd 0.14.0
    "BSD-2-Clause",  # zstd-sys 2.1.3 is BSD-3-Clause AND BSD-2-Clause
    "bzip2-1.0.6",
    "CC0-1.0",       # Public domain dedication (ppmd-rust via sevenz-rust2)
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
skip = [
    # Proc-macro crates still on syn 2:
    # - enumflags2_derive (landlock, Linux-only CLI sandbox)
    # - zerocopy-derive (half -> ciborium -> criterion dev-dep)
    # - zeroize_derive (zeroize)
    { crate = "syn@2", reason = "enumflags2_derive, zerocopy-derive, and zeroize_derive have not moved to syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
