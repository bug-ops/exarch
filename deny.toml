# cargo-deny configuration

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",  # zstd/zstd-safe/zstd-sys switched from MIT starting at zstd 0.14.0
    "bzip2-1.0.6",
    "CC0-1.0",       # Public domain dedication (ppmd-rust via sevenz-rust2)
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# zip v9.0.0-pre3 transitively pins the old zstd/zstd-safe line instead of the
# 0.14.0 direct dependency; intentional exception pending zip's upgrade (#578).
[[bans.skip]]
name = "zstd"
version = "=0.13.3"

[[bans.skip]]
name = "zstd-safe"
version = "=7.3.0"

# Pre-existing proc-macro ecosystem split, out of scope for #578: napi-derive/pyo3-macros/
# zerocopy-derive pull syn 2.x while clap_derive/futures-macro/serde_derive/thiserror-impl/
# tokio-macros have moved to syn 3.x. A follow-up consolidation issue will be filed separately.
[[bans.skip]]
name = "syn"
version = "=2.0.119"

[[bans.skip]]
name = "syn"
version = "=3.0.6"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
